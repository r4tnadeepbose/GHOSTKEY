name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include real bot tokens, chat IDs, or window titles from live sessions.**
        Sanitize logs before pasting. Security issues go to SECURITY.md, not here.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch ghostkey
        2. Click Start
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Ghostkey version / commit
      placeholder: "1.0.0 or commit hash"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux (X11)
        - Linux (Wayland)
        - macOS
        - Other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized traceback / log excerpt
      description: Remove tokens, chat IDs, personal data, and window titles.
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I removed credentials and personal activity data.
          required: true
        - label: I am using this tool only on devices I own or am authorized to monitor.
          required: true
