[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostkey"
version = "1.0.0"
description = "Local foreground-activity telemetry dashboard with optional Telegram relay."
readme = "readme.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "r4tnadeepbose" }]
keywords = ["activity", "telemetry", "dashboard", "tkinter", "telegram", "foreground-window"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
]
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
ghostkey = "scan:main"

[project.urls]
Homepage = "https://github.com/r4tnadeepbose/GHOSTKEY"
Issues = "https://github.com/r4tnadeepbose/GHOSTKEY/issues"
Changelog = "https://github.com/r4tnadeepbose/GHOSTKEY/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["scan"]

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
